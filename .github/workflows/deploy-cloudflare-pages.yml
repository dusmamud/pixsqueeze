# Deploy ImgCompressor (static, no backend) to Cloudflare Pages on every push to main.
# Required GitHub secrets (repo > Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN  — Pages:Edit + Account:Read (or use CLOUDFLARE_API_KEY + CLOUDFLARE_EMAIL)
#   CLOUDFLARE_ACCOUNT_ID — from Cloudflare dashboard, right sidebar
# Rename CLOUDFLARE_PROJECT_NAME below to your Pages project, or set it as a secret/variable.
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=imgcompressor --commit-dirty=true
