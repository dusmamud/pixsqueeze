<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ImgCompressor — compress images 100% in your browser. No uploads, no backend, no tracking." />
    <meta name="theme-color" content="#0a0e14" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      // Prevent theme flash: localStorage > system preference > dark default (Spotify-style dark first)
      try {
        var t = localStorage.getItem('imgcompressor-theme');
        if (!t) t = 'dark';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <!-- Scroll reveals render their initial state (opacity 0) into the
         prerendered HTML; without JS they would stay invisible. This
         noscript rule restores them (the !important beats the inline
         style) so the sections are fully readable with JS disabled. -->
    <noscript><style>[data-reveal]{opacity:1 !important;transform:none !important}</style></noscript>
    <title>ImgCompressor — Client-Side Image Compressor</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
